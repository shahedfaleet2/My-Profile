    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <style>
        /* تنسيق خلفية الصفحة العامة */
        body {
            background-color: #222b22; /* لون الخلفية الداكن المشابه للصورة */
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* صندوق الملف الشخصي الرئيسي */
        .profile-card {
            text-align: center;
            padding: 20px;
        }

        /* عنوان My Profile */
        .profile-card h1 {
            font-size: 2.2rem;
            margin-bottom: 30px;
            font-weight: bold;
        }

        /* تنسيق الصورة الدائرية */
        .profile-img {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 40px;
        }

        /* تنسيق أسطر المعلومات (الاسم، المسمى، الوصف) */
        .info-row {
            margin: 15px 0;
            font-size: 1.1rem;
            text-align: right;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 15px;
        }

        /* الحقول السوداء التي بداخلها النصوص (Name, Position, Description) */
        .label {
            background-color: #000000;
            color: #ffffff;
            padding: 6px 12px;
            font-weight: bold;
            min-width: 110px;
            text-align: left;
        }

        /* النصوص المميزة باللون الأصفر الفاتح */
        .value {
            background-color: #ccff00; /* لون التظليل الأصفر النيون */
            color: #000000;
            padding: 6px 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- عنوان الصفحة -->
        <h1>My Profile</h1>

        <!-- صورة الشخص (قم بتغيير الرابط إلى صورة شخصية إذا أردت) -->
        <img src="image/5197ba0605af.jpg"Profile Picture" class="profile-img">

        <!-- حقل الاسم -->
        <div class="info-row">
            <span class="label">Name:</span>
            <span class="value">Shahd Emad</span>
        </div>

        <!-- حقل المسمى الوظيفي -->
        <div class="info-row">
            <span class="label">Position:</span>
            <span class="value">Frontend Developer</span>
        </div>

        <!-- حقل الوصف -->
        <div class="info-row">
            <span class="label">Description:</span>
            <span class="value">I build clean and user-friendly websites</span>
        </div>
    </div>

</body>
